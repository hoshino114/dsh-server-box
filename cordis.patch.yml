# dsh-server-box:服务器卡片仪表盘 + 趋势记录 + SFTP 文件传输。
#
# Node 半区:/server-box/api/* REST(主机台账 CRUD + 连通探测 + 指标采集/趋势查询
#            + /files* 文件传输:列目录 / 上传 / 下载 / 建目录 / 删除)
#            与 /server-box/ws/pty 升级路由(xterm 终端 PTY 桥);
#            MetricRecorder 常驻采集(默认 10s);
#            server_box_upload / server_box_download 对话传输工具。
# Client 半区:双形态挂载——ctx.betterSidebar 可用 → registerTab 注册
#            「服务器」页签;不可用(3s 宽限轮询后)→ 自绘右侧可展开/收起面板。
#            与 github-workbench 同款协商策略,装载顺序无关。
- insert:
    - id: server-box
      name: dsh-server-box
